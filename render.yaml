services:
  - type: web
    name: smart-attendance
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:create_app()"
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: attendance-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: attendance-db
    databaseName: attendance_prod
    user: attendance_user
    plan: free
